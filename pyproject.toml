[project]
name = "weather-data-analysis-dashboard"
version = "0.1.0"
description = ""
authors = [
    {name = "N"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit (>=1.60.0,<2.0.0)",
    "streamlit-extras (>=1.6.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "vega-datasets (>=0.9.0,<0.10.0)",
    "pydeck (>=0.9.3,<0.10.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "altair (>=6.2.2,<7.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "pytz (>=2026.3,<2027.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "google-genai (>=2.16.0,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"

